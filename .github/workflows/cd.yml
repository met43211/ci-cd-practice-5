name: CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: manashkin/cd_docker_project:latest

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_CHECKOUT_TOKEN != '' && secrets.GH_CHECKOUT_TOKEN || github.token }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository (для отправки compose на сервер)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_CHECKOUT_TOKEN != '' && secrets.GH_CHECKOUT_TOKEN || github.token }}

      - name: Подготовить SSH ключ
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${SSH_PRIVATE_KEY:-}" || { echo "::error::SSH_PRIVATE_KEY пустой"; exit 1; }
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/gh_deploy.pem"
          tr -d '\r' < "$HOME/.ssh/gh_deploy.pem" > "$HOME/.ssh/gh_deploy.unix"
          mv "$HOME/.ssh/gh_deploy.unix" "$HOME/.ssh/gh_deploy.pem"
          chmod 600 "$HOME/.ssh/gh_deploy.pem"
          ssh-keygen -y -f "$HOME/.ssh/gh_deploy.pem" >/dev/null

      - name: Загрузить docker-compose.yml на сервер
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key_path: /home/runner/.ssh/gh_deploy.pem
          source: docker-compose.yml
          target: ~/cd_docker_project/

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key_path: /home/runner/.ssh/gh_deploy.pem
          script: |
            mkdir -p ~/cd_docker_project
            cd ~/cd_docker_project
            export DOCKER_IMAGE=${{ env.IMAGE_NAME }}
            docker compose -f docker-compose.yml pull web
            docker compose -f docker-compose.yml down || true
            docker compose -f docker-compose.yml up -d

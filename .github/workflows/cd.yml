name: CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: manashkin/cd_docker_project:latest

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_CHECKOUT_TOKEN != '' && secrets.GH_CHECKOUT_TOKEN || github.token }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository (для отправки compose на сервер)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_CHECKOUT_TOKEN != '' && secrets.GH_CHECKOUT_TOKEN || github.token }}

      # Только секрет SSH_PRIVATE_KEY_B64 (одна строка). Многострочный PEM в секретах GitHub без base64 здесь не используйте — ломается.
      - name: Подготовить SSH ключ (из Base64)
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          PEM="$HOME/.ssh/gh_deploy.pem"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          if [ -z "${SSH_PRIVATE_KEY_B64:-}" ]; then
            echo "::error::Секрет SSH_PRIVATE_KEY_B64 не задан или пустой."
            echo "::error::На сервере выполните:  base64 -w0 ~/.ssh/github_actions"
            echo "::error::(если файл ключа другой — подставьте его путь) и вставьте ВСЮ выводную строку в GitHub Secrets."
            exit 1
          fi
          if ! printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d ' \t\n\r' | base64 --decode > "$PEM"; then
            echo "::error::Не удалось Base64-декодировать SSH_PRIVATE_KEY_B64. Переснимите строку без пробелов и переносов."
            exit 1
          fi
          chmod 600 "$PEM"
          if ! ssh-keygen -y -f "$PEM" >/dev/null 2>&1; then
            echo "::error::После декодирования файл не является действительным ключом."
            echo "::error::На сервере снова: base64 -w0 ~/.ssh/github_actions → полностью замените значение секрета SSH_PRIVATE_KEY_B64 на GitHub."
            exit 1
          fi

      - name: Загрузить docker-compose.yml на сервер
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key_path: /home/runner/.ssh/gh_deploy.pem
          source: docker-compose.yml
          target: ~/cd_docker_project/

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key_path: /home/runner/.ssh/gh_deploy.pem
          script: |
            mkdir -p ~/cd_docker_project
            cd ~/cd_docker_project
            export DOCKER_IMAGE=${{ env.IMAGE_NAME }}
            docker compose -f docker-compose.yml pull web
            docker compose -f docker-compose.yml down || true
            docker compose -f docker-compose.yml up -d

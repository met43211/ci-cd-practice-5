name: CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: manashkin/cd_docker_project:latest

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_CHECKOUT_TOKEN != '' && secrets.GH_CHECKOUT_TOKEN || github.token }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository (для отправки compose на сервер)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_CHECKOUT_TOKEN != '' && secrets.GH_CHECKOUT_TOKEN || github.token }}

      - name: Подготовить SSH ключ
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          python3 <<'PYCODE'
          import os, base64, pathlib, subprocess, sys

          pem = pathlib.Path.home() / ".ssh" / "gh_deploy.pem"
          raw_b64 = (os.environ.get("SSH_PRIVATE_KEY_B64") or "").strip().replace("\n", "").replace(" ", "")
          raw_plain = os.environ.get("SSH_PRIVATE_KEY") or ""

          if raw_b64:
              try:
                  data = base64.b64decode(raw_b64)
              except Exception as exc:
                  print(f"::error::SSH_PRIVATE_KEY_B64 не декодируется: {exc}")
                  sys.exit(1)
          elif raw_plain.strip():
              txt = raw_plain.replace("\r\n", "\n").replace("\r", "\n").lstrip("\ufeff").rstrip("\n") + "\n"
              data = txt.encode("utf-8")
          else:
              print("::error::Нужен секрет SSH_PRIVATE_KEY_B64 (рекомендуется) или SSH_PRIVATE_KEY.")
              sys.exit(1)

          pem.write_bytes(data)
          pem.chmod(0o600)
          try:
              subprocess.run(["ssh-keygen", "-y", "-f", str(pem)], check=True, stdout=subprocess.DEVNULL)
          except subprocess.CalledProcessError:
              print("::error::Ключ после записи недействителен (libcrypto). "
                    "Чаще всего секрет содержимое испорчено — используйте SSH_PRIVATE_KEY_B64 на сервере: "
                    "base64 -w0 ~/.ssh/gh_deploy.pem")
              sys.exit(1)
          PYCODE

      - name: Загрузить docker-compose.yml на сервер
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key_path: /home/runner/.ssh/gh_deploy.pem
          source: docker-compose.yml
          target: ~/cd_docker_project/

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key_path: /home/runner/.ssh/gh_deploy.pem
          script: |
            mkdir -p ~/cd_docker_project
            cd ~/cd_docker_project
            export DOCKER_IMAGE=${{ env.IMAGE_NAME }}
            docker compose -f docker-compose.yml pull web
            docker compose -f docker-compose.yml down || true
            docker compose -f docker-compose.yml up -d

name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: manashkin/cd_docker_project:latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (для отправки compose на сервер)
        uses: actions/checkout@v4

      - name: Загрузить docker-compose.yml на сервер
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: ~/cd_docker_project/

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/cd_docker_project
            cd ~/cd_docker_project
            export DOCKER_IMAGE=${{ env.IMAGE_NAME }}
            docker compose -f docker-compose.yml pull web
            docker compose -f docker-compose.yml down || true
            docker compose -f docker-compose.yml up -d
